[build]
  command = "npm run build"
  publish = "dist"

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  publish = "dist"

[[edge_functions]]
  path = "/api/aircraft"
  function = "aircraft"

[[edge_functions]]
  path = "/api/location"
  function = "location"

[[edge_functions]]
  path = "/api/route"
  function = "route"
